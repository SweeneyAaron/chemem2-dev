[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemem-mcp"
version = "0.1.0"
description = "MCP server and local Ollama agent for staged cryoEM ligand fitting with ChemEM."
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]",
  "pydantic>=2",
  "pyyaml",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
chemem-mcp = "chemem_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chemem_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
